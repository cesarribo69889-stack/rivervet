# ═══════════════════════════════════════════════════════════════════════
#  CD del FRONTEND de RiverVet — despliegue continuo a Vercel
#
#  Se dispara SOLO cuando la CI terminó en verde después de un merge a main,
#  y espera la APROBACIÓN MANUAL del environment "produccion".
#  (vercel.json desactiva los despliegues automáticos de Vercel por Git:
#  solo este workflow publica, y solo después de pasar la CI.)
#
#  Orden:  1) build de producción   2) despliegue en Vercel
#          3) health check (60 s): la página y /api/health a través del rewrite
#          4) si falla: rollback instantáneo de Vercel + aviso
#
#  Mientras no exista la variable URL_FRONTEND_PRODUCCION (Vercel aún no
#  configurado), el job se OMITE.
# ═══════════════════════════════════════════════════════════════════════

name: Frontend CD

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-produccion-frontend
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # Versión FIJA de la CLI de Vercel (no "latest"): lo que funciona hoy
  # debe funcionar igual mañana.
  VERCEL_CLI: vercel@59.16.0
  # Identificadores del proyecto en Vercel (secretos del environment).
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  URL_FRONTEND: ${{ vars.URL_FRONTEND_PRODUCCION }}

# Monorepo: todos los comandos "run" se ejecutan dentro de frontend/.
# (Las rutas de las acciones con "uses:" siguen siendo desde la raíz.)
defaults:
  run:
    working-directory: frontend

jobs:
  desplegar:
    name: desplegar a producción
    if: >-
      vars.URL_FRONTEND_PRODUCCION != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: ${{ vars.URL_FRONTEND_PRODUCCION }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Descargar el commit aprobado por la CI
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Instalar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Trae la configuración del proyecto de Vercel (entorno production).
      - name: Vercel — preparar
        run: npx --yes ${{ env.VERCEL_CLI }} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Compila aquí, en la máquina de GitHub, lo mismo que probó la CI.
      - name: Vercel — compilar
        run: npx --yes ${{ env.VERCEL_CLI }} build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Sube lo compilado y lo publica como producción.
      - name: Vercel — desplegar
        id: despliegue
        run: |
          URL=$(npx --yes ${{ env.VERCEL_CLI }} deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Desplegado en: $URL"

      # Health check: la SPA carga Y la API responde a través del rewrite de
      # vercel.json (así se verifica también la conexión frontend → backend).
      - name: Health check (máximo 60 s)
        run: |
          for intento in $(seq 1 12); do
            if curl --fail --silent --max-time 5 "$URL_FRONTEND/" | grep -q 'id="app"' \
               && curl --fail --silent --max-time 5 "$URL_FRONTEND/api/health" > /dev/null; then
              echo "OK: la SPA y /api/health responden."; exit 0
            fi
            echo "Intento $intento/12 sin éxito; reintento en 5 s..."
            sleep 5
          done
          echo "::error::El frontend o el rewrite a la API no respondieron en 60 segundos"
          exit 1

      # ROLLBACK: Vercel guarda los despliegues anteriores; "rollback" vuelve
      # a poner en producción el último que funcionaba, al instante.
      - name: Rollback — restaurar el despliegue anterior de Vercel
        if: failure() && steps.despliegue.outcome == 'success'
        run: npx --yes ${{ env.VERCEL_CLI }} rollback --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Avisar al equipo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Falló el despliegue del frontend (${COMMIT::7})" \
            --body "El workflow CD falló. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          - Rollback ejecutado: ${{ steps.despliegue.outcome == 'success' }}
          - Revisa el log del job y la guía de despliegue del backend (docs/DESPLIEGUE.md)."
